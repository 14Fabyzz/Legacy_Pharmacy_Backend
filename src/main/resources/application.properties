spring.datasource.url=${SPRING_DATASOURCE_URL}
# Estas credenciales de abajo se ignoran si la URL viene completa,
# pero no hace daño dejarlas como respaldo.
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:santi2703}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
# Usa 'update' para que cree las tablas la primera vez y las respete después
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# --- BORRA LAS LÍNEAS TEMPORALES DE AQUÍ ---
