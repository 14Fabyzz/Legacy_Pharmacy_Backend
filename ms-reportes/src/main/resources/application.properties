# =============================================================================
# MICROSERVICIO REPORTES - Legacy Pharmacy
# =============================================================================

# ==============================================================
# SERVIDOR
# ==============================================================
server.port=8084
server.servlet.context-path=/api/v1/reportes

# ==============================================================
# APLICACION
# ==============================================================
spring.application.name=ms-reportes

# ==============================================================
# BASE DE DATOS PostgreSQL (Aiven - misma BD de MS-ventas, solo lectura)
# ==============================================================
spring.datasource.url=jdbc:postgresql://pg-2714c85d-hincapiemaya66-ca69.h.aivencloud.com:16558/defaultdb?sslmode=require
spring.datasource.username=${env.AIVEN_USER}
spring.datasource.password=${env.AIVEN_PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones Hikari (conservador - solo lectura)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ReportesHikariPool

# ==============================================================
# JPA / HIBERNATE (Solo lectura - NO modificar esquema de ventas)
# ==============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================
# ACTUATOR
# ==============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==============================================================
# LOGGING
# ==============================================================
logging.level.com.legacy.pharmacy.reportes=DEBUG

# ==============================================================
# SEGURIDAD JWT (Sincronizada con Usuarios y Gateway)
# ==============================================================
jwt.secret=${JWT_SECRET:your_jwt_secret_here_for_local_dev}
jwt.expiration=86400000
