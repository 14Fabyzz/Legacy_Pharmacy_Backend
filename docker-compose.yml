version: '3.8'

services:
  # Tu aplicación Spring Boot
  backend-inventario:
    build: .
    container_name: microservicio-inventario
    ports:
      - "8080:8080"
    environment:
      # MUY IMPORTANTE: La app Dockerizada se conecta al servicio interno 'mysqldb'
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/legacy03?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=fabian
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - mysqldb
    networks:
      - red-farmacia

  # La base de datos MySQL
  mysqldb:
    image: mysql:8.0
    container_name: mysql-legacy-db
    ports:
      # El 3306 DE SU PC DEBE ESTAR LIBRE para que Docker lo use.
      # Usaremos 3306 (externo) -> 3306 (interno)
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=legacy03
      - MYSQL_ROOT_PASSWORD=fabian
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - red-farmacia

networks:
  red-farmacia:
    driver: bridge

volumes:
  mysql_data: