version: '3.8'

services:
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - URI_INVENTARIO=http://ms-inventario:8081
      - URI_USUARIOS=http://ms-usuarios:8082
      - URI_VENTAS=http://ms-ventas:8083
      - URI_AGENTE_IA=http://ms-agente-ia:8000
      - URI_REPORTES=http://ms-reportes:8084
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - pharmacy-network
    depends_on:
      - ms-inventario
      - ms-usuarios
      - ms-ventas
      - ms-agente-ia

  ms-inventario:
    build: ./inventory-service
    container_name: ms-inventario
    ports:
      - "8081:8081"
    environment:
      # MS-Inventario usa su propia configuración interna (application.properties)
      # que ya apunta a Aiven MySQL.
      - SPRING_PROFILES_ACTIVE=default
      # Configuración Aiven MySQL para Inventario
      - SPRING_DATASOURCE_URL=jdbc:mysql://legacy03-fbenjumeau-515c.g.aivencloud.com:17293/defaultdb?sslMode=REQUIRED&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${AIVEN_USER}
      - SPRING_DATASOURCE_PASSWORD=${AIVEN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # Cloudinary
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - pharmacy-network

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8082:8082"
    environment:
      # Conexión a Aiven MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://legacy03-fbenjumeau-515c.g.aivencloud.com:17293/defaultdb?sslMode=REQUIRED&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${AIVEN_USER}
      - SPRING_DATASOURCE_PASSWORD=${AIVEN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - pharmacy-network

  ms-ventas:
    build: ./MS-ventas
    container_name: ms-ventas
    ports:
      - "8083:8083"
    environment:
      # Conexión a Aiven PostgreSQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-2714c85d-hincapiemaya66-ca69.h.aivencloud.com:16558/defaultdb?sslmode=require
      - SPRING_DATASOURCE_USERNAME=${AIVEN_USER}
      - SPRING_DATASOURCE_PASSWORD=${AIVEN_PG_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # URL para conectarse al servicio de inventario
      - URI_INVENTARIO=http://ms-inventario:8081/api/v1/inventario
    networks:
      - pharmacy-network

  ms-agente-ia:
    build: ./ms-agente-ia
    container_name: ms-agente-ia
    ports:
      - "8000:8000"
    env_file:
      - ./ms-agente-ia/.env
    networks:
      - pharmacy-network

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    ports:
      - "8084:8084"
    environment:
      # ms-reportes usa spring-dotenv: las variables se inyectan como AIVEN_USER, AIVEN_PG_PASSWORD
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-2714c85d-hincapiemaya66-ca69.h.aivencloud.com:16558/defaultdb?sslmode=require
      - AIVEN_USER=${AIVEN_USER}
      - AIVEN_PG_PASSWORD=${AIVEN_PG_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MS_REPORTES_GEMINI_API_KEY=${MS_REPORTES_GEMINI_API_KEY}
      - URI_VENTAS=http://ms-ventas:8083
      - URI_INVENTARIO=http://ms-inventario:8081
    networks:
      - pharmacy-network
    
  frontend-pharmacy:
    build: ../Legacy-Pharmacy
    container_name: pharmacy-frontend
    ports:
      - "80:80"
      - "443:443" # Abrimos el puerto de seguridad
    networks:
      - pharmacy-network
    depends_on:
      - gateway-service
    volumes:
      - ../Legacy-Pharmacy/nginx.conf:/etc/nginx/conf.d/default.conf
      # ESTO ES LO NUEVO: Conectamos los certificados
      - /etc/letsencrypt:/etc/letsencrypt:ro 

networks:
  pharmacy-network:
    driver: bridge

